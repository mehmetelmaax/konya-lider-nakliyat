name: Konya Lider Nakliyat CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ==========================================================
  # JOB 1 — KALİTE KAPISI (BLOKLAYICI)
  # Yalnızca deterministik adımlar. Kırmızıysa gerçek bir bug var.
  # ==========================================================
  quality:
    name: Kalite Kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      # Node sürümü .nvmrc'den okunur -> yerel makine ile CI ASLA ayrışmaz.
      # 22.12.0 seçildi çünkü: next@16 (>=20.9), vitest@4 -> vite@8 (^20.19 || >=22.12)
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Hata ayıklamayı kolaylaştıran teşhis çıktısı.
      # Gelecekte bir şey patlarsa log'un ilk satırında sebebi görünür.
      - name: Ortam teşhisi
        run: |
          echo "Node    : $(node -v)"
          echo "npm     : $(npm -v)"
          echo "OS      : $(uname -a)"
          echo "CPU     : $(nproc) çekirdek"
          echo "Bellek  : $(free -h | awk '/^Mem:/{print $2}')"
          node -e "const p=require('./package.json');console.log('next   :',p.dependencies.next);console.log('vitest :',p.devDependencies.vitest)"

      # engine-strict=true olduğu için sürüm uyumsuzluğu BURADA,
      # net bir mesajla patlar; gizemli bir test hatası olarak değil.
      - name: Bağımlılıkları kur
        run: npm ci

      # Node sürüm tabanını MAKİNE hesaplar, insan tahmin etmez.
      # Bir bağımlılık tabanı yükseltirse burada, hangi paket olduğu
      # ve hangi sürüme geçileceği yazılı olarak patlar.
      - name: Node sürüm tabanı denetimi
        run: npm run check:node

      - name: TypeScript denetimi
        run: npm run typecheck

      - name: ESLint denetimi
        run: npm run lint

      - name: Testler
        run: npm test

      - name: Production build
        run: npm run build

      # Canlıya çıkmadan önceki son güvenlik ağı:
      # build çıktısı gerçekten üretilmiş mi, kritik dosyalar yerinde mi?
      - name: Deploy hazırlık doğrulaması
        run: |
          set -e
          test -d .next || { echo "HATA: .next üretilmedi"; exit 1; }
          test -f .next/BUILD_ID || { echo "HATA: BUILD_ID yok"; exit 1; }
          echo "Build ID: $(cat .next/BUILD_ID)"
          echo "Statik boyut: $(du -sh .next/static | cut -f1)"
          echo "Üretilen sayfa sayısı: $(find .next/server/app -name '*.html' | wc -l)"

  # ==========================================================
  # JOB 2 — PERFORMANS ÖLÇÜMÜ (BLOKLAMAZ)
  # Lighthouse paylaşımlı runner'da ±15 puan oynar. Bloklayıcı
  # yapmak mükemmel bir sitede bile rastgele kırmızı üretir.
  # Artifact aktarımı yerine yeniden build: daha yavaş ama
  # kırılacak bir parça daha az.
  # ==========================================================
  performance:
    name: Performans Ölçümü (bilgilendirme)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse denetimi
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/blog
            http://localhost:3000/hizmetler/asansorlu-evden-eve-nakliyat
          startServerCommand: npm run start
          startServerReadyTimeout: 90000
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
