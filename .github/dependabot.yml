version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      devDependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
          - "major"
